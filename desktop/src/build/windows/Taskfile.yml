version: "3"

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the Windows binary
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
      - task: common:generate:icons
    cmds:
      - task: generate:syso
        vars:
          ARCH: "{{.ARCH}}"
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui"{{else}}-buildvcs=false -gcflags=all="-l"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: "0"
      GOARCH: "{{.ARCH | default ARCH}}"
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Builds a slim GUI exe and wraps it with the portable zip in an NSIS installer
    cmds:
      - task: build
        vars:
          PRODUCTION: "true"
          ARCH: "{{.ARCH}}"
      - cmd: >-
          powershell -NoProfile -Command
          "if (-not (Test-Path '{{.PORTABLE_ZIP}}')) { throw 'portable zip not found: {{.PORTABLE_ZIP}}' };
          Copy-Item -Force '{{.PORTABLE_ZIP}}' 'build/windows/nsis/runtime.zip'"
        platforms: [windows]
      - cmd: |
          test -f "{{.PORTABLE_ZIP}}"
          cp "{{.PORTABLE_ZIP}}" build/windows/nsis/runtime.zip
        platforms: [linux, darwin]
      - task: create:nsis:installer
        vars:
          ARCH: "{{.ARCH}}"
    vars:
      ARCH: "{{.ARCH | default ARCH}}"
      PORTABLE_ZIP: '{{.PORTABLE_ZIP | default (printf "../portable/release/Octop-windows-%s.zip" .ARCH)}}'

  create:nsis:installer:
    summary: Creates an NSIS installer (Octop.exe + Octop-windows-<arch>.zip)
    dir: build/windows/nsis
    preconditions:
      - sh: command -v makensis >/dev/null 2>&1
        msg: "makensis is required (install NSIS)"
    cmds:
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - |
        {{if eq OS "windows"}}
        makensis -DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" project.nsi
        {{else}}
        makensis -DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" project.nsi
        {{end}}
      - cmd: powershell Remove-Item -Force runtime.zip -ErrorAction SilentlyContinue
        platforms: [windows]
      - cmd: rm -f runtime.zip
        platforms: [linux, darwin]
    vars:
      ARCH: "{{.ARCH | default ARCH}}"
      ARG_FLAG: '{{if eq (.ARCH | default ARCH) "amd64"}}AMD64{{else}}ARM64{{end}}'

  run:
    cmds:
      - "{{.BIN_DIR}}/{{.APP_NAME}}.exe"

  generate:syso:
    summary: Generates Windows .syso (linked from module root)
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: "{{.ARCH | default ARCH}}"
